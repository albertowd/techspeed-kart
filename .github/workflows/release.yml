# Builds the full fleet (36 liveries per version, tools/build_all.py --release) when a release is published and
# attaches the two archives to it. Local builds carry one livery per kart.
#
# The AC karts use the sound banks of the GoKart 0.5c mod: its archive is in the repository (Git LFS) as
# references/GoKart_0.5c.7z, and the release build stops without it rather than ship silent karts.
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the tools' packages
        run: python -m pip install -r requirements.txt

      - name: Check the tag against the version in overtake/OVERTAKE.md
        shell: pwsh
        run: |
          $ver = (Select-String -Path overtake/OVERTAKE.md -Pattern '^Version:\s*(\S+)').Matches[0].Groups[1].Value
          $tag = "${{ github.event.release.tag_name }}".TrimStart("v")
          if ($ver -ne $tag) { throw "release tag $tag does not match OVERTAKE.md version $ver" }

      - name: Extract the AC sound banks
        shell: pwsh
        run: |
          if (-not (Test-Path references/GoKart_0.5c.7z)) { throw "references/GoKart_0.5c.7z is missing" }
          7z x references/GoKart_0.5c.7z -oreference/GoKart_0.5c gokart125/sfx gokart390/sfx -r

      - name: Build both games with every livery
        run: python tools/build_all.py --release

      - name: Attach the archives to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem build/dist/*).FullName --clobber
